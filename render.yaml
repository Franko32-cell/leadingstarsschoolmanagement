services:
  - type: web
    name: school-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    preDeployCommand: python manage.py migrate
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_SENDER_ID
        value: "LEADSTARS"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: TERMII_WHATSAPP_DEVICE_ID
        sync: false
      - key: TERMII_WHATSAPP_REPORT_TEMPLATE_ID
        sync: false
      - key: TERMII_WHATSAPP_BILL_TEMPLATE_ID
        sync: false
      - key: TERMII_WHATSAPP_RECEIPT_TEMPLATE_ID
        sync: false
